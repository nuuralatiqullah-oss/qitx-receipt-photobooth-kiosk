<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Photobooth</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1626;
  --ink-soft:#6b6480;
  --paper:#ffffff;
  --wash:#f6f3ff;
  --mango:#ffb703;
  --punch:#ff4d6d;
  --jade:#06d6a0;
  --sky:#3a86ff;
  --line:#e7e2f5;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:Outfit,'Segoe UI',system-ui,-apple-system,sans-serif;
  overflow:hidden;user-select:none;
}

/* ---------- paper texture + colour blobs ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(var(--line) 1.1px, transparent 1.1px);
  background-size:17px 17px;opacity:.55;
}
.blob{position:absolute;border-radius:50%;filter:blur(52px);opacity:.3}
.blob.a{width:48vmin;height:48vmin;background:var(--mango);top:-16vmin;left:-14vmin}
.blob.b{width:42vmin;height:42vmin;background:var(--sky);bottom:-14vmin;right:-12vmin}
.blob.c{width:34vmin;height:34vmin;background:var(--punch);top:38%;right:-16vmin;opacity:.2}
.blob.d{width:30vmin;height:30vmin;background:var(--jade);bottom:22%;left:-13vmin;opacity:.22}

/* confetti: framing, denser near the edges */
.dot,.bar{position:absolute}
.dot{width:12px;height:12px;border-radius:50%}
.bar{width:9px;height:26px;border-radius:5px}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.screen.active{display:flex}

header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;flex:0 0 auto;
}
.brand{font-family:Fredoka,'Trebuchet MS','Segoe UI Rounded',system-ui,sans-serif;font-weight:600;font-size:21px;line-height:1.05;letter-spacing:-.01em}
.brand small{display:block;font-family:inherit;font-size:11px;font-weight:500;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em}

.chip{
  display:inline-flex;align-items:center;gap:8px;
  border:2px solid var(--ink);border-radius:999px;
  background:var(--paper);color:var(--ink);
  padding:0 15px;min-height:46px;
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  box-shadow:2px 2px 0 var(--ink);
}
.chip:active{transform:translate(2px,2px);box-shadow:none}
.chip.quiet{border-color:var(--line);box-shadow:none;color:var(--ink-soft)}
.dotled{width:10px;height:10px;border-radius:50%;background:var(--punch);flex:0 0 auto}
.dotled.on{background:var(--jade)}

.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 20px 26px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100%}

h1{
  font-family:Fredoka,'Trebuchet MS','Segoe UI Rounded',system-ui,sans-serif;font-weight:600;
  font-size:clamp(38px,8.5vw,68px);line-height:.98;letter-spacing:-.02em;
  margin:0 0 10px;max-width:14ch;
}
h2{font-family:Fredoka,'Trebuchet MS','Segoe UI Rounded',system-ui,sans-serif;font-weight:500;font-size:25px;margin:0 0 14px}
.lead{color:var(--ink-soft);font-size:16px;line-height:1.55;max-width:30ch;margin:0 auto 26px}

/* sticker buttons */
.btn{
  font-family:inherit;font-weight:700;font-size:16px;
  border:2.5px solid var(--ink);border-radius:999px;
  background:var(--mango);color:var(--ink);
  padding:17px 38px;min-height:60px;cursor:pointer;
  box-shadow:4px 4px 0 var(--ink);
  transition:transform .1s ease,box-shadow .1s ease;
}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.42;box-shadow:2px 2px 0 var(--ink)}
.btn.go{background:var(--jade)}
.btn.alt{background:var(--paper)}
.btn.blue{background:var(--sky);color:#fff}
.btn.small{font-size:13px;padding:12px 20px;min-height:48px;box-shadow:3px 3px 0 var(--ink)}
.btn.block{width:100%;max-width:430px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%;max-width:470px}
.revacts{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.row .btn{flex:1 1 150px}

/* ---------- the paper strip (the hero) ---------- */
.strip{
  position:relative;background:var(--paper);
  border:2.5px solid var(--ink);border-radius:8px;
  padding:12px 12px 18px;width:min(188px,44vw);
  box-shadow:7px 7px 0 var(--ink);transform:rotate(-2.5deg);
}
.strip i{display:block;background:var(--wash);border:2px solid var(--ink);border-radius:4px;aspect-ratio:4/3;margin-bottom:9px}
.strip i:nth-child(1){background:var(--mango)}
.strip i:nth-child(2){background:var(--sky)}
.strip i:nth-child(3){background:var(--punch);margin-bottom:0}
.strip::after{
  content:"";position:absolute;left:-2.5px;right:-2.5px;bottom:-9px;height:10px;
  background:var(--ink);
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 14px);
  mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 14px);
}

/* ---------- frame picker ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:18px;max-width:900px;margin:0 auto}
.card{
  position:relative;background:var(--paper);padding:0;cursor:pointer;
  border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;
  aspect-ratio:2/3;box-shadow:4px 4px 0 var(--ink);
}
.card:nth-child(3n+1){transform:rotate(-1.4deg)}
.card:nth-child(3n+2){transform:rotate(1.1deg)}
.card.sel{box-shadow:4px 4px 0 var(--jade),0 0 0 4px var(--jade)}
.card canvas{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.card .tag{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--ink);color:#fff;
  padding:8px 10px;font-size:11px;font-weight:600;letter-spacing:.02em;
}
.card.sel .tag{background:var(--jade);color:var(--ink)}

.footer-bar{
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:12px;flex:0 0 auto;
  background:linear-gradient(transparent,#fff 42%);
}

/* ---------- capture ----------
   The preview box is set to the exact shape of the photo slot that
   is being filled (--slot-ar), and the capture is cropped to the
   same shape, so what a guest frames is what gets printed. */
.capwrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  gap:14px;padding:4px 14px 14px;min-height:0;
}
.stage{
  position:relative;background:var(--ink);overflow:hidden;
  border-radius:var(--r);border:2.5px solid var(--ink);
  aspect-ratio:var(--slot-ar,4/3);
  max-width:100%;max-height:100%;
  width:auto;height:100%;flex:0 1 auto;
}
#video{width:100%;height:100%;object-fit:cover;display:block}
#video.mirror{transform:scaleX(-1)}

/* live strip: filled slots plus the one being shot now */
.ministrip{
  flex:0 0 auto;width:74px;background:var(--paper);
  border:2.5px solid var(--ink);border-radius:8px;
  padding:6px;display:flex;flex-direction:column;gap:5px;
  box-shadow:3px 3px 0 var(--ink);max-height:100%;overflow:hidden;
}
.ministrip b{
  display:block;font-size:7.5px;font-weight:700;text-align:center;
  letter-spacing:.03em;color:var(--ink);line-height:1.1;
}
.ministrip s{display:block;background:var(--wash);border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;position:relative;flex:0 0 auto}
.ministrip s img{width:100%;height:100%;object-fit:cover;display:block}
/* the slot being shot right now: outlined, not filled, so it doesn't
   look like a photo is already in it */
.ministrip s.now{
  border:2px dashed var(--punch);background:var(--paper);
  animation:pulse 1.6s ease-in-out infinite;
}
.ministrip s.now::after{
  content:"";position:absolute;left:50%;top:50%;
  width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
  border-radius:50%;background:var(--punch);
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.capside{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:12px}
.capside .btn{white-space:nowrap}
.count{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-family:Fredoka,'Trebuchet MS','Segoe UI Rounded',system-ui,sans-serif;font-weight:600;font-size:min(40vw,250px);color:#fff;
  text-shadow:0 6px 30px rgba(0,0,0,.45);
}
.count.show{display:flex}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.fire{animation:fl .45s ease-out}
@keyframes fl{from{opacity:.95}to{opacity:0}}
.shots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.thumb{width:40px;height:54px;border-radius:7px;border:2.5px solid var(--line);background:var(--wash);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.done{border-color:var(--ink)}
.hint{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  background:var(--paper);border:2px solid var(--ink);border-radius:999px;
  padding:7px 16px;font-size:13px;font-weight:600;white-space:nowrap;
}

/* ---------- review / done ---------- */
.sheet{
  background:#fff;border:2.5px solid var(--ink);border-radius:8px;
  max-height:50vh;width:auto;display:block;margin:0 auto 20px;
  box-shadow:6px 6px 0 var(--ink);
}
#qrBox{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:12px;display:none;margin:0 auto 18px;box-shadow:4px 4px 0 var(--ink)}
#qrBox canvas{display:block}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;
  background:var(--ink);color:#fff;border-radius:14px;
  padding:14px 18px;font-size:14px;line-height:1.45;max-width:88vw;display:none;
}
.toast.err{background:var(--punch)}
.toast.show{display:block}

.spin{
  width:46px;height:46px;border:5px solid var(--line);
  border-top-color:var(--punch);border-radius:50%;
  animation:sp 1s linear infinite;margin:0 auto 20px;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* Landscape: stand the finished strip next to its buttons rather than
   stacking them, so the strip can use the full height. */
@media (orientation:landscape){
  #scrReview .center{flex-direction:row;gap:30px;align-items:center;justify-content:center}
  #scrReview .sheet{max-height:78vh;margin:0}
  #scrReview .revacts{display:flex;flex-direction:column;gap:12px;width:auto}
  #scrReview .revacts .row{max-width:300px}
}

/* Portrait: strip beside the preview, button underneath. */
@media (orientation:portrait){
  .capwrap{flex-wrap:wrap;align-content:center}
  .stage{flex:1 1 auto;height:auto;max-height:66vh}
  .capside{flex:1 0 100%;order:3}
  .capside .btn{width:100%;max-width:430px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="blob a"></span><span class="blob b"></span>
  <span class="blob c"></span><span class="blob d"></span>
  <span class="dot" style="top:12%;left:7%;background:var(--punch)"></span>
  <span class="bar" style="top:19%;right:10%;background:var(--jade);transform:rotate(24deg)"></span>
  <span class="dot" style="top:31%;left:13%;background:var(--sky);width:8px;height:8px"></span>
  <span class="bar" style="bottom:26%;left:8%;background:var(--mango);transform:rotate(-18deg)"></span>
  <span class="dot" style="bottom:15%;right:14%;background:var(--punch);width:9px;height:9px"></span>
  <span class="bar" style="bottom:9%;right:26%;background:var(--sky);transform:rotate(39deg)"></span>
  <span class="dot" style="top:8%;right:30%;background:var(--mango)"></span>
</div>

<!-- ============ WELCOME ============ -->
<section id="scrWelcome" class="screen active">
  <header>
    <div class="brand" id="brandName">BOOTH<small id="brandEvent"></small></div>
    <div style="display:flex;gap:8px">
      <button class="chip" id="btnPrinter"><span class="dotled" id="printerDot"></span><span id="printerLabel">Printer</span></button>
      <button class="chip quiet" id="btnAdmin" aria-label="Admin">Admin</button>
    </div>
  </header>
  <div class="body">
    <div class="center">
      <div class="strip" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1 id="welcomeTitle" style="margin-top:26px">Say cheese</h1>
      <p class="lead" id="welcomeLead"></p>
      <button class="btn go" id="btnStart">Start</button>
    </div>
  </div>
</section>

<!-- ============ FRAME PICKER ============ -->
<section id="scrFrames" class="screen">
  <header>
    <button class="chip quiet" id="btnFramesBack">Back</button>
    <div class="brand">Pick a layout</div>
    <button class="chip" id="btnPrinter2"><span class="dotled" id="printerDot2"></span>Printer</button>
  </header>
  <div class="body"><div class="grid" id="frameGrid"></div></div>
  <div class="footer-bar"><button class="btn go block" id="btnUseFrame" disabled>Use this layout</button></div>
</section>

<!-- ============ CAPTURE ============ -->
<section id="scrCapture" class="screen">
  <header>
    <button class="chip quiet" id="btnCaptureBack">Back</button>
    <div class="brand" id="captureCount">1 / 3</div>
    <button class="chip" id="btnFlip">Flip</button>
  </header>
  <div class="capwrap">
    <div class="ministrip" id="miniStrip" aria-hidden="true"></div>
    <div class="stage" id="stage">
      <video id="video" playsinline autoplay muted></video>
      <div class="hint" id="captureHint">Tap when you're ready</div>
      <div class="count" id="countdown">3</div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="capside">
      <div class="shots" id="shots"></div>
      <button class="btn block" id="btnShoot">Take photo</button>
    </div>
  </div>
</section>

<!-- ============ REVIEW ============ -->
<section id="scrReview" class="screen">
  <header>
    <button class="chip quiet" id="btnReviewHome">Home</button>
    <div class="brand">Your strip</div>
    <button class="chip" id="btnPrinter3"><span class="dotled" id="printerDot3"></span>Printer</button>
  </header>
  <div class="body">
    <div class="center">
      <canvas id="previewCanvas" class="sheet"></canvas>
      <div class="revacts">
        <div class="row">
          <button class="btn alt" id="btnRetake">Retake</button>
          <button class="btn go" id="btnPrint">Print it</button>
        </div>
        <div class="row">
          <button class="btn alt small" id="btnSave">Save</button>
          <button class="btn blue small" id="btnShare">Share</button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ PRINTING ============ -->
<section id="scrPrinting" class="screen">
  <div class="body">
    <div class="center">
      <div class="spin"></div>
      <h2 id="printingMsg">Printing…</h2>
      <p class="lead">Take your strip from the printer</p>
    </div>
  </div>
</section>

<!-- ============ DONE ============ -->
<section id="scrDone" class="screen">
  <header>
    <button class="chip quiet" id="btnDoneHome">Home</button>
    <div class="brand">All done</div>
    <span style="width:84px"></span>
  </header>
  <div class="body">
    <div class="center">
      <h1>Thank you</h1>
      <div id="qrBox"><canvas id="qrCanvas"></canvas></div>
      <p class="lead" id="doneLead">Scan the code to keep a digital copy</p>
      <div class="row">
        <button class="btn alt" id="btnPrintAgain">Print again</button>
        <button class="btn go" id="btnFinish">Start over</button>
      </div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/settings.js"></script>
<script src="assets/frames.js"></script>
<script src="assets/imaging.js"></script>
<script src="assets/printer.js"></script>
<script src="assets/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
